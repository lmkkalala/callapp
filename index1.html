<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel='stylesheet' type='text/css' media='screen' href='styles.css'>
</head>
<body>
    <div class="container">
        <div class="row">
            <div id="videos" class="mt-3">
                <div id="video-wrapper">
                    <!-- <div id="waiting" class="btn btn-warning">Waiting for answer...</div> -->
                    <video class="video-player" id="local-video" autoplay playsinline controls></video>
                </div>
                <div class="video-wrapper">
                    <video class="video-player" id="remote-video" autoplay playsinline controls></video>
                </div>
            </div>
        </div>
        <div class="row mb-3 mt-3 justify-content-md-center">
            <div id="user-name"></div>
            <div class="row">
                <div class="col-md-12">
                    <div class="row">
                        <div class="col-md-6 mt-2">
                            <button id="call" class="btn btn-secondary w-100">Appeler</button>
                        </div>
                        <div class="col-md-6 mt-2">
                            <button id="hangup" class="btn btn-danger w-100">Raccrocher</button>
                        </div>
                        <div class="col-md-6 mt-2">
                            <button id="usercode" class="btn btn-success w-100">Usercode</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="answer" class="col"></div>
        </div>
    </div>
</body>
<script src="./socket.io/socket.io.js"></script>
<script src='scripts.js'></script>
<script src='socketListeners.js'></script>
</html>
